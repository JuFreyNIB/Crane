<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Kran 3D</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;overflow:hidden;font-family:system-ui,sans-serif}#ui{position:fixed;top:12px;left:12px;background:rgba(255,255,255,.92);border:1px solid #ccc;border-radius:8px;padding:10px 14px;font-size:13px;line-height:2;display:none}button{background:#2a6dd9;color:#fff;border:none;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:10}.sp{width:40px;height:40px;border:4px solid #eee;border-top-color:#2a6dd9;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head><body>
<div id="loading"><div class="sp"></div><span id="msg">Lade...</span></div>
<div id="ui">Linke Maus: Drehen &nbsp;|&nbsp; Rechte Maus: Schieben &nbsp;|&nbsp; Rad: Zoom<br><button onclick="resetCam()">Reset</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
var scene=new THREE.Scene(); scene.background=new THREE.Color(0xffffff);
var camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,1e9);
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1.0));
var sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(1,2,1.5); scene.add(sun);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08;
var savedPos,savedTarget;
function resetCam(){if(savedPos){camera.position.copy(savedPos);controls.target.copy(savedTarget);controls.update();}}
var blackMat=new THREE.MeshStandardMaterial({color:0x000000});
new THREE.GLTFLoader().load(
  'https://raw.githubusercontent.com/JuFreyNIB/Crane/main/kran_small.glb',
  function(gltf){
    var obj=gltf.scene;
    obj.traverse(function(c){if(c.isMesh)c.material=blackMat;});
    scene.add(obj);
    var box=new THREE.Box3().setFromObject(obj);
    var center=box.getCenter(new THREE.Vector3());
    var size=box.getSize(new THREE.Vector3());
    var mx=Math.max(size.x,size.y,size.z);
    controls.target.copy(center);
    camera.position.set(center.x+mx*0.8,center.y+mx*0.5,center.z+mx);
    camera.near=mx*0.0001; camera.far=mx*50; camera.updateProjectionMatrix();
    controls.update();
    savedPos=camera.position.clone(); savedTarget=controls.target.clone();
    document.getElementById('loading').style.display='none';
    document.getElementById('ui').style.display='block';
  },
  function(xhr){if(xhr.total)document.getElementById('msg').textContent='Lade... '+Math.round(xhr.loaded/xhr.total*100)+'%';},
  function(e){document.getElementById('msg').textContent='Fehler: '+e;}
);
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);})();
window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
