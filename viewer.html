<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kran 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;top:12px;left:12px;background:rgba(255,255,255,.9);border:1px solid #ddd;border-radius:8px;padding:10px 14px;font-size:13px;line-height:2}
button{background:#2a6dd9;color:#fff;border:none;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:12px}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:10}
.sp{width:40px;height:40px;border:4px solid #eee;border-top-color:#2a6dd9;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="sp"></div><span id="msg">Lade...</span></div>
<div id="ui" style="display:none">
Linke Maus: Drehen &nbsp; Rechte Maus: Schieben &nbsp; Rad: Zoom<br>
<button onclick="resetCam()">Reset Kamera</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const BASE = 'https://raw.githubusercontent.com/JuFreyNIB/Crane/main/';

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1e9);
camera.position.set(500, 300, 600);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(1, 2, 1.5);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xaabbcc, 0.4);
fill.position.set(-1, 0.5, -1);
scene.add(fill);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

let savedPos, savedTarget;
function resetCam(){
  if(savedPos){ camera.position.copy(savedPos); controls.target.copy(savedTarget); controls.update(); }
}

// Load MTL then OBJ
document.getElementById('msg').textContent = 'Lade Materialien...';
const mtlLoader = new THREE.MTLLoader();
mtlLoader.setPath(BASE);
mtlLoader.load('uploads_files_2747349_kran.mtl', mtl => {
  mtl.preload();
  // Fix dark/invisible materials
  Object.values(mtl.materials).forEach(mat => {
    mat.side = THREE.DoubleSide;
    const c = mat.color;
    if(c && c.r+c.g+c.b < 0.3) mat.color.set(0x555555);
    if(c && c.r+c.g+c.b > 2.4) mat.color.set(0xaaaaaa);
  });

  document.getElementById('msg').textContent = 'Lade Modell (2MB)...';
  const objLoader = new THREE.OBJLoader();
  objLoader.setMaterials(mtl);
  objLoader.setPath(BASE);
  objLoader.load('uploads_files_2747349_kran.obj', obj => {
    // Ensure double-sided and fix dark materials on loaded meshes
    obj.traverse(child => {
      if(child.isMesh){
        child.castShadow = true;
        const m = child.material;
        const mats = Array.isArray(m) ? m : [m];
        mats.forEach(mat => {
          mat.side = THREE.DoubleSide;
          if(mat.color){
            const s = mat.color.r+mat.color.g+mat.color.b;
            if(s < 0.3) mat.color.set(0x555555);
          }
        });
      }
    });

    scene.add(obj);

    // Auto-fit camera
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);

    controls.target.copy(center);
    camera.position.set(
      center.x + maxDim,
      center.y + maxDim * 0.6,
      center.z + maxDim * 1.2
    );
    camera.near = maxDim * 0.0001;
    camera.far = maxDim * 50;
    camera.updateProjectionMatrix();
    controls.update();

    savedPos = camera.position.clone();
    savedTarget = controls.target.clone();

    // Grid
    const grid = new THREE.GridHelper(maxDim*2, 20, 0xcccccc, 0xe8e8e8);
    grid.position.set(center.x, box.min.y, center.z);
    scene.add(grid);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('ui').style.display = 'block';
  },
  xhr => { document.getElementById('msg').textContent = 'Lade Modell... ' + Math.round(xhr.loaded/xhr.total*100) + '%'; },
  err => { document.getElementById('msg').textContent = 'Fehler: ' + err; });
},
undefined,
err => { document.getElementById('msg').textContent = 'MTL Fehler: ' + err; });

// Render loop
(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
window.addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
